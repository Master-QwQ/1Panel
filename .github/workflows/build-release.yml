name: Build 1Panel Release

on:
  workflow_dispatch:
    inputs:
      artifact_name:
        description: 'Artifact name'
        required: false
        default: '1panel-release'

permissions:
  contents: read

jobs:
  build:
    name: Build Linux amd64 release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.1'
          cache: true

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build:pro

      - name: Build Core and Agent
        shell: bash
        run: |
          mkdir -p build/release

          pushd core
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 \
            go build -trimpath -ldflags '-s -w' \
            -o ../build/release/1panel-core cmd/server/main.go
          popd

          pushd agent
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 \
            go build -trimpath -ldflags '-s -w' \
            -o ../build/release/1panel-agent cmd/server/main.go
          popd

      - name: Package release
        shell: bash
        run: |
          tar -czf "build/${{ inputs.artifact_name }}.tar.gz" \
            -C build/release 1panel-core 1panel-agent \
            -C ../../core/cmd/server web

      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.artifact_name }}
          path: build/${{ inputs.artifact_name }}.tar.gz
          if-no-files-found: error
          retention-days: 14